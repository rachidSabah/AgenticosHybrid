[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentic-os"
version = "0.2.0"
description = "Agentic OS — a local-first, event-bus-driven AI Agent Operating System."
readme = "README.md"
requires-python = ">=3.13"
license = { text = "Apache-2.0" }
authors = [{ name = "Agentic OS Contributors" }]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "anyio>=4.6.0",
    "redis>=5.2.0",
    "nats-py>=2.7.0",
    "structlog>=24.11.0",
    "prometheus-client>=0.21.0",
    "python-multipart>=0.0.12",
    "httpx>=0.27.0",
    "cryptography>=43.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.7.0",
    "ty>=0.0.1a",
]

[tool.hatch.build.targets.wheel]
packages = ["src/agentic_os"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]  # FastAPI dependency injection uses function calls in arg defaults

[tool.uv]
required-version = ">=0.9"
