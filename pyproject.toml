[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentic-os"
version = "1.0.0-rc2"
description = "Agentic OS — a local-first, event-bus-driven AI Agent Operating System."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "Agentic OS Contributors" }]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "anyio>=4.6.0",
    "redis>=5.2.0",
    "nats-py>=2.7.0",
    "structlog>=24.11.0",
    "prometheus-client>=0.21.0",
    "python-multipart>=0.0.12",
    "httpx>=0.27.0",
    "cryptography>=43.0.0",
    "opentelemetry-api>=1.25.0",
    "opentelemetry-sdk>=1.25.0",
    "opentelemetry-exporter-otlp>=1.25.0",
    "opentelemetry-exporter-prometheus>=0.45b0",
    "psutil>=7.2.2",
]

[project.scripts]
agentic-os = "agentic_os.__main__:main"

[project.optional-dependencies]
mcp-docker = ["docker>=7.0.0"]
mcp-postgres = ["asyncpg>=0.29.0"]
mcp = ["docker>=7.0.0", "asyncpg>=0.29.0"]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.7.0",
    "ty>=0.0.1a",
]

[tool.hatch.build.targets.wheel]
packages = ["src/agentic_os"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src", "services"]
filterwarnings = [
    "ignore::DeprecationWarning:pytest_asyncio",
    "ignore::DeprecationWarning:asyncio",
]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]
exclude = ["services/"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008", "UP037"]  # B008: FastAPI DI, UP037: forward refs in dataclasses

[tool.ruff.lint.per-file-ignores]
"tests/test_sd_*.py" = ["E402"]  # services/ must be added to sys.path before imports

[tool.ty.analysis]
allowed-unresolved-imports = ["docker", "asyncpg", "psutil"]

[tool.uv]
required-version = ">=0.9"
