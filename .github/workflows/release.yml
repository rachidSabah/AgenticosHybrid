name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag (e.g. v1.0.0-1)"
        required: true
        type: string

env:
  CARGO_TERM_COLOR: always
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

jobs:
  # ── Linux Build ──────────────────────────────────────────
  build-linux:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    name: "Linux (AppImage / DEB / RPM)"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mission-control

    steps:
      - uses: actions/checkout@v7

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libayatana-appindicator3-dev \
            dpkg-dev \
            rpm

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/mission-control/package-lock.json

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/mission-control/src-tauri

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install uv
        run: pip install uv

      - name: Bundle backend source
        shell: bash
        working-directory: .
        run: |
          mkdir -p apps/mission-control/src-tauri/resources/backend/src
          cp -r src/agentic_os apps/mission-control/src-tauri/resources/backend/src/
          cp pyproject.toml apps/mission-control/src-tauri/resources/backend/
          [ -f uv.lock ] && cp uv.lock apps/mission-control/src-tauri/resources/backend/
          ls -la apps/mission-control/src-tauri/resources/backend/src/agentic_os/

      - name: Install npm dependencies
        run: npm ci --legacy-peer-deps

      - name: Build Tauri
        env:
          TAURI_SIGNING_PRIVATE_KEY: ""
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: npx tauri build --bundles appimage,deb,rpm

      - name: Collect artifacts
        shell: bash
        run: |
          mkdir -p dist/artifacts
          BUNDLE_DIR="src-tauri/target/release/bundle"
          PRODUCT="AgenticOS"

          # AppImage
          for f in "$BUNDLE_DIR"/appimage/*.AppImage; do
            [ -f "$f" ] && cp "$f" "dist/artifacts/${PRODUCT}-x86_64.AppImage"
          done
          # DEB
          for f in "$BUNDLE_DIR"/deb/*.deb; do
            [ -f "$f" ] && cp "$f" "dist/artifacts/${PRODUCT}-x86_64.deb"
          done
          # RPM
          for f in "$BUNDLE_DIR"/rpm/*.rpm; do
            [ -f "$f" ] && cp "$f" "dist/artifacts/${PRODUCT}-x86_64.rpm"
          done

          ls -la dist/artifacts/

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: linux-artifacts
          path: apps/mission-control/dist/artifacts/*
          if-no-files-found: error

  # ── Windows Build ───────────────────────────────────────
  build-windows:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    name: "Windows (EXE / MSI / ZIP)"
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/mission-control

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/mission-control/package-lock.json

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/mission-control/src-tauri

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install uv
        run: pip install uv

      - name: Bundle backend source
        shell: pwsh
        working-directory: .
        run: |
          $resourcesDir = "apps/mission-control/src-tauri/resources/backend"
          New-Item -ItemType Directory -Force -Path "$resourcesDir/src" | Out-Null
          Copy-Item -Recurse "src/agentic_os" "$resourcesDir/src/" -Force
          Copy-Item "pyproject.toml" "$resourcesDir/" -Force
          if (Test-Path "uv.lock") { Copy-Item "uv.lock" "$resourcesDir/" -Force }
          Get-ChildItem -Recurse "$resourcesDir" | Select-Object -First 20

      - name: Install npm dependencies
        run: npm ci --legacy-peer-deps

      - name: Build Tauri
        env:
          TAURI_SIGNING_PRIVATE_KEY: ""
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: npx tauri build --bundles nsis,msi

      - name: Create portable ZIP
        shell: pwsh
        run: |
          $Product = "AgenticOS"
          $Binary = "src-tauri/target/release/agentic-os.exe"
          $PortableDir = "dist/portable"
          $ArtifactsDir = "dist/artifacts"

          New-Item -ItemType Directory -Force -Path $ArtifactsDir | Out-Null
          New-Item -ItemType Directory -Force -Path $PortableDir | Out-Null

          # Copy binary
          if (Test-Path $Binary) {
            Copy-Item $Binary "$PortableDir/agentic-os.exe" -Force
          }

          # Copy backend source
          $backendSrc = "src-tauri/resources/backend"
          if (Test-Path $backendSrc) {
            New-Item -ItemType Directory -Force -Path "$PortableDir/backend" | Out-Null
            Copy-Item -Recurse "$backendSrc/*" "$PortableDir/backend/" -Force
          }

          # Create launcher scripts
          Set-Content -Path "$PortableDir/start.bat" -Value @'
          @echo off
          echo Starting AgenticOS Desktop Runtime...
          start "" "%~dp0agentic-os.exe"
          '@

          Set-Content -Path "$PortableDir/start.ps1" -Value @'
          Write-Host "Starting AgenticOS Desktop Runtime..." -ForegroundColor Cyan
          Start-Process -FilePath "$PSScriptRoot\agentic-os.exe"
          '@

          # Create ZIP
          Compress-Archive -Path "$PortableDir/*" -DestinationPath "$ArtifactsDir/${Product}-Portable-x64.zip" -Force

          # Copy NSIS installer
          $nsisFiles = Get-ChildItem "src-tauri/target/release/bundle/nsis" -Filter "*.exe" -ErrorAction SilentlyContinue
          foreach ($f in $nsisFiles) {
            Copy-Item $f.FullName "$ArtifactsDir/${Product}-Setup-x64.exe" -Force
          }

          # Copy MSI installer
          $msiFiles = Get-ChildItem "src-tauri/target/release/bundle/msi" -Filter "*.msi" -ErrorAction SilentlyContinue
          foreach ($f in $msiFiles) {
            Copy-Item $f.FullName "$ArtifactsDir/${Product}-Setup-x64.msi" -Force
          }

          # Generate SHA256 checksums
          $checksumsPath = "$ArtifactsDir/SHA256SUMS.txt"
          Get-ChildItem $ArtifactsDir -File | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)" | Out-File -FilePath $checksumsPath -Encoding ascii -Append
          }

          Get-ChildItem $ArtifactsDir

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: windows-artifacts
          path: apps/mission-control/dist/artifacts/*
          if-no-files-found: error

  # ── macOS Build ─────────────────────────────────────────
  build-macos:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    name: "macOS (DMG)"
    runs-on: macos-latest
    defaults:
      run:
        working-directory: apps/mission-control

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/mission-control/package-lock.json

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/mission-control/src-tauri

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install uv
        run: pip install uv

      - name: Bundle backend source
        shell: bash
        working-directory: .
        run: |
          mkdir -p apps/mission-control/src-tauri/resources/backend/src
          cp -r src/agentic_os apps/mission-control/src-tauri/resources/backend/src/
          cp pyproject.toml apps/mission-control/src-tauri/resources/backend/
          [ -f uv.lock ] && cp uv.lock apps/mission-control/src-tauri/resources/backend/
          ls -la apps/mission-control/src-tauri/resources/backend/src/agentic_os/

      - name: Install npm dependencies
        run: npm ci --legacy-peer-deps

      - name: Build Tauri
        env:
          TAURI_SIGNING_PRIVATE_KEY: ""
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: npx tauri build --bundles dmg

      - name: Collect artifacts
        shell: bash
        run: |
          mkdir -p dist/artifacts
          BUNDLE_DIR="src-tauri/target/release/bundle"
          PRODUCT="AgenticOS"

          for f in "$BUNDLE_DIR"/dmg/*.dmg; do
            [ -f "$f" ] && cp "$f" "dist/artifacts/${PRODUCT}-x86_64.dmg"
          done

          # Also try for macOS .app if DMG not produced
          for f in "$BUNDLE_DIR"/macos/*.app; do
            [ -f "$f" ] && cp -R "$f" "dist/artifacts/"
          done

          ls -la dist/artifacts/

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: macos-artifacts
          path: apps/mission-control/dist/artifacts/*
          if-no-files-found: warn

  # ── Aggregate & Release ─────────────────────────────────
  release:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    name: "Publish Release"
    needs: [build-linux, build-windows, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read

    steps:
      - uses: actions/checkout@v7

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-assets

      - name: Prepare release assets
        shell: bash
        run: |
          mkdir -p final-assets
          find release-assets -type f -exec cp {} final-assets/ \;
          ls -la final-assets/

      - name: Generate combined SHA256SUMS
        shell: bash
        run: |
          cd final-assets
          # Remove any existing checksums file and regenerate
          rm -f SHA256SUMS.txt
          for f in *; do
            if [ -f "$f" ]; then
              sha256sum "$f" | tee -a SHA256SUMS.txt
            fi
          done
          echo ""
          echo "=== Combined Checksums ==="
          cat SHA256SUMS.txt

      - name: Generate release manifest
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          cat > final-assets/release-manifest.json << EOF
          {
          "version": "$VERSION",
          "releaseDate": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
          "commit": "$(git rev-parse HEAD)",
          "platforms": {
            "windows": {
              "os": "Windows 10+",
              "arch": "x86_64",
              "installers": ["AgenticOS-Setup-x64.exe", "AgenticOS-Setup-x64.msi", "AgenticOS-Portable-x64.zip"]
            },
            "linux": {
              "os": "Linux (glibc >= 2.28)",
              "arch": "x86_64",
              "installers": ["AgenticOS-x86_64.AppImage", "AgenticOS-x86_64.deb", "AgenticOS-x86_64.rpm"]
            },
            "macos": {
              "os": "macOS 12+",
              "arch": "x86_64",
              "installers": ["AgenticOS-x86_64.dmg"]
            }
          }
          }
          EOF

      - name: Generate release notes
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME}"
          # Extract relevant section from CHANGELOG or generate from commits
          LAST_TAG=$(git describe --tags --abbrev=0 HEAD~1 2>/dev/null || echo "")
          COMMITS=$(git log --oneline "${LAST_TAG}..HEAD" 2>/dev/null || git log --oneline -20)
          cat > final-assets/release-notes.md << EOF
          ## AgenticOS $VERSION

          ### Installation

          **Windows:**
          - \`AgenticOS-Setup-x64.exe\` — NSIS installer
          - \`AgenticOS-Setup-x64.msi\` — MSI installer
          - \`AgenticOS-Portable-x64.zip\` — Portable (no install required)

          **Linux:**
          - \`AgenticOS-x86_64.AppImage\` — AppImage (chmod +x and run)
          - \`AgenticOS-x86_64.deb\` — Debian/Ubuntu package
          - \`AgenticOS-x86_64.rpm\` — Fedora/RHEL package

          **macOS:**
          - \`AgenticOS-x86_64.dmg\` — Apple Disk Image

          ### Changelog

          $COMMITS

          ### Checksums

          See `SHA256SUMS.txt` attached to this release.
          EOF
          cat final-assets/release-notes.md

      - name: Upload release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          name: "AgenticOS ${{ github.ref_name }}"
          body_path: final-assets/release-notes.md
          files: |
            final-assets/*
          prerelease: ${{ contains(github.ref_name, 'rc') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'alpha') }}
          generate_release_notes: false
