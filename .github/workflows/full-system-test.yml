name: Full System Test (Windows + WSL)

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  UV_SYSTEM_PYTHON: 1
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"

jobs:
  test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install uv
        run: pip install uv
      - name: Install backend deps
        run: uv sync --dev
      - name: Ruff lint
        run: uv run ruff check src/
      - name: Ruff format check
        run: uv run ruff format --check src/
      - name: Type check
        run: uv run ty check src/
      - name: Backend tests
        run: uv run pytest tests/ -x -q --tb=short --ignore=tests/test_phase2_integration.py --ignore=tests/test_desktop_stress.py --ignore=tests/test_omniroute --ignore=tests/test_discovery_telemetry.py
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/mission-control/package-lock.json
      - name: Install frontend deps
        working-directory: apps/mission-control
        run: npm ci --legacy-peer-deps
      - name: TypeScript check
        working-directory: apps/mission-control
        run: npx tsc --noEmit
      - name: Lint
        working-directory: apps/mission-control
        run: npx next lint
      - name: Unit tests
        working-directory: apps/mission-control
        run: npx vitest run
      - name: Build
        working-directory: apps/mission-control
        run: npx next build
      - name: Backend boots
        env:
          # Skip Brains auto-detection — the Windows process scan
          # (detect_all_with_windows) spawns multiple PowerShell + where.exe
          # subprocesses and has been observed to silently crash the backend
          # partway through. The REST-API is fully usable without it.
          AGENTICOS_SKIP_BRAIN_AUTODETECT: "1"
        run: |
          Start-Process -FilePath "uv" -ArgumentList "run","python","-m","agentic_os","serve","--host","127.0.0.1","--port","8000" -NoNewWindow -RedirectStandardOutput "backend.log" -RedirectStandardError "backend_err.log"
          # Poll /healthz with retries — Windows backend startup takes ~40s
          # (runtime discovery + SQLite init + lifecycle phases), much slower
          # than Linux (~5s). A single Start-Sleep 15 was too short.
          $ok = $false
          for ($i = 0; $i -lt 30; $i++) {
            Start-Sleep -Seconds 3
            try {
              $resp = Invoke-WebRequest -Uri "http://127.0.0.1:8000/healthz" -UseBasicParsing -ErrorAction Stop
              if ($resp.StatusCode -eq 200) { $ok = $true; break }
            } catch { Write-Host "  attempt $($i+1)/30: backend not ready yet" }
          }
          if (-not $ok) { throw "Backend health check failed after 30 retries (90s)" }
          Write-Host "Backend: OK"
      - name: API endpoints respond
        run: |
          # Small warm-up — give the desktop runtime (DesktopRuntime.start())
          # a moment to finish initializing after REST-API came up.
          Start-Sleep -Seconds 3
          try {
            Invoke-WebRequest -Uri "http://127.0.0.1:8000/api/tasks" -UseBasicParsing -ErrorAction Stop | Out-Null
            Write-Host "Tasks: OK"
          } catch {
            Write-Host "Tasks endpoint failed — backend may have crashed. Backend log:"
            Get-Content backend.log -Tail 30 -ErrorAction SilentlyContinue
            Get-Content backend_err.log -Tail 30 -ErrorAction SilentlyContinue
            throw
          }
          Invoke-WebRequest -Uri "http://127.0.0.1:8000/api/providers" -UseBasicParsing | Out-Null
          Write-Host "Providers: OK"
          Invoke-WebRequest -Uri "http://127.0.0.1:8000/api/workspace/current" -UseBasicParsing | Out-Null
          Write-Host "Workspace: OK"
      - name: Collect diagnostics
        if: always()
        run: |
          Write-Host "=== Backend Log (last 50 lines) ==="
          Get-Content backend.log -Tail 50 -ErrorAction SilentlyContinue
          Get-Content backend_err.log -Tail 50 -ErrorAction SilentlyContinue

  test-wsl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install uv
        run: pip install uv
      - name: Install backend deps
        run: uv sync --dev
      - name: Ruff lint
        run: uv run ruff check src/
      - name: Ruff format check
        run: uv run ruff format --check src/
      - name: Type check
        run: uv run ty check src/
      - name: Backend tests
        run: uv run pytest tests/ -x -q --tb=short --ignore=tests/test_phase2_integration.py --ignore=tests/test_desktop_stress.py --ignore=tests/test_omniroute --ignore=tests/test_discovery_telemetry.py
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/mission-control/package-lock.json
      - name: Install frontend deps
        working-directory: apps/mission-control
        run: npm ci --legacy-peer-deps
      - name: TypeScript check
        working-directory: apps/mission-control
        run: npx tsc --noEmit
      - name: Lint
        working-directory: apps/mission-control
        run: npx next lint
      - name: Unit tests
        working-directory: apps/mission-control
        run: npx vitest run
      - name: Build
        working-directory: apps/mission-control
        run: npx next build
      - name: Backend boots (Linux)
        run: |
          uv run python -m agentic_os serve --host 127.0.0.1 --port 8000 &
          sleep 15
          curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8000/healthz
          echo " <- healthz"
      - name: API endpoints respond (Linux)
        run: |
          echo "Tasks: $(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/api/tasks)"
          echo "Providers: $(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/api/providers)"
          echo "Workspace: $(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/api/workspace/current)"
          echo "Worktrees: $(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/api/worktrees/list)"
          echo "Executions: $(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/api/executions)"
      - name: Create mission + verify task pipeline
        run: |
          MISSION=$(curl -s -X POST http://127.0.0.1:8000/api/missions \
            -H "Content-Type: application/json" \
            -d '{"title":"CI Test","prompt":"Test prompt","description":"Test","priority":"high","execution_mode":"hybrid"}')
          MID=$(echo "$MISSION" | python3 -c "import sys,json; print(json.load(sys.stdin)['id'])")
          echo "Mission created: $MID"
          curl -s -X POST "http://127.0.0.1:8000/api/missions/$MID/plan" | python3 -c "import sys,json; d=json.load(sys.stdin); print(f'Plan: {len(d.get(\"tasks\",[]))} tasks')"
          curl -s -X POST "http://127.0.0.1:8000/api/missions/$MID/start" | python3 -c "import sys,json; d=json.load(sys.stdin); print(f'Status: {d.get(\"status\")}')"
          sleep 5
          TASKS=$(curl -s http://127.0.0.1:8000/api/tasks)
          echo "$TASKS" | python3 -c "import sys,json; tasks=json.load(sys.stdin); print(f'Tasks: {len(tasks)}'); [print(f'  {t[\"id\"][:8]} status={t[\"status\"]}') for t in tasks[:3]]"
