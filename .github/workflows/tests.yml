name: CI

on:
  push:
  pull_request:
  merge_group:

jobs:
  ruff-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --dev
      - run: uv run ruff format --check

  ruff-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --dev
      - run: uv run ruff check

  ty:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --dev --extra mcp
      - run: uv run ty check src/

  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --dev
      - run: uv run pytest -v --tb=short --ignore=tests/test_phase2_integration.py --ignore=tests/test_desktop_stress.py -x -q

  mission-control:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mission-control
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/mission-control/package-lock.json
      - run: npm ci --legacy-peer-deps
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - run: npm run build

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --dev
      - run: uv run pytest tests/test_phase2_integration.py tests/test_desktop_stress.py -v --tb=short -x -q
        timeout-minutes: 8
      - name: Cleanup on failure
        if: ${{ failure() }}
        run: echo "Integration tests timed out - skipping long-running kernel boot tests"

  ci-gate:
    name: CI
    needs: [ruff-format, ruff-check, ty, pytest, integration, mission-control]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Check all required jobs passed
        run: |
          echo "${{ needs.ruff-format.result }}"
          echo "${{ needs.ruff-check.result }}"
          echo "${{ needs.ty.result }}"
          echo "${{ needs.pytest.result }}"
          echo "${{ needs.mission-control.result }}"
          if [[ "${{ needs.ruff-format.result }}" != "success" ]] ||
             [[ "${{ needs.ruff-check.result }}" != "success" ]] ||
             [[ "${{ needs.ty.result }}" != "success" ]] ||
             [[ "${{ needs.pytest.result }}" != "success" ]] ||
             [[ "${{ needs.mission-control.result }}" != "success" ]]; then
            echo "One or more required jobs failed"
            exit 1
          fi
